<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Castorice Virtual Companion 💕</title>
    <style>
        /* Mengunci layar agar pas di HP dan tidak bisa di-scroll */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container Utama Hub */
        .hub-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Menumpuk elemen dari bawah ke atas agar tombol selalu terlihat */
            align-items: center;
            padding: 10px 15px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.1);
            gap: 8px; /* Jarak antar elemen lebih rapat */
        }

        /* Area Sprite Karakter */
        .sprite-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            width: 100%;
            max-height: 52vh; /* Batasi tinggi maksimum sprite agar tidak menabrak bawah */
            -webkit-tap-highlight-color: transparent;
        }

        .sprite-area img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
            transition: transform 0.1s ease;
            user-select: none;
        }

        .sprite-area img:active {
            transform: scale(0.97);
        }

        /* Kotak Teks / Dialog */
        .dialog-box {
            color: #fff;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 10px;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            width: 100%;
            box-sizing: border-box;
        }

        /* Menu Tombol Tersembunyi */
        .menu-grid {
            display: none; 
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
            margin-bottom: 5px;
        }

        .menu-grid.show {
            display: grid; 
        }

        .menu-btn {
            background: rgba(255, 105, 180, 0.9);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 5px rgba(0,0,0,0.3);
        }

        .menu-btn:active {
            background: rgba(255, 20, 147, 1);
        }
    </style>
</head>
<body>

    <div class="hub-container">
        <!-- Sprite Interaktif -->
        <div class="sprite-area" onclick="handleSpriteTouch()">
            <img id="castoriceSprite" src="SpriteCD1.png" alt="Castorice Sprite">
        </div>

        <!-- Kotak Dialog -->
        <div class="dialog-box" id="dialogText">
            ✨ Castorice sedang menunggumu... Sentuh gambarnya!
        </div>

        <!-- 4 Tombol Fitur Utama -->
        <div class="menu-grid" id="menuGrid">
            <button class="menu-btn" onclick="openMenu('Chat')">💬 Obrolan AI</button>
            <button class="menu-btn" onclick="openMenu('Game')">🎮 Main Game</button>
            <button class="menu-btn" onclick="openMenu('Wardrobe')">👗 Wardrobe</button>
            <button class="menu-btn" onclick="openMenu('Mood')">📊 Cek Mood</button>
        </div>
    </div>

    <script>
        let isTouched = false;

        function handleSpriteTouch() {
            isTouched = !isTouched;
            const spriteImg = document.getElementById('castoriceSprite');
            const menuGrid = document.getElementById('menuGrid');
            const dialogText = document.getElementById('dialogText');

            if (isTouched) {
                spriteImg.src = 'SpriteCD2.png';
                menuGrid.classList.add('show');
                dialogText.innerHTML = "✨ 'Ada apa, suamiku?'";
            } else {
                spriteImg.src = 'SpriteCD1.png';
                menuGrid.classList.remove('show');
                dialogText.innerHTML = "✨ Castorice menatapmu dengan lembut.";
            }
        }

        function openMenu(feature) {
            alert("Membuka fitur: " + feature);
        }
    </script>
</body>
</html>
