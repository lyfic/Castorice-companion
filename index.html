<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Castorice Virtual Companion 💕</title>
    <style>
        /* Menggunakan dvh agar pas di layar HP tanpa tertutup bilah browser */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container Utama Hub */
        .hub-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.15);
            position: relative;
        }

        /* Tombol Settings di Sudut Atas */
        .settings-icon {
            position: absolute;
            top: 10px;
            right: 15px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 16px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Halaman (Views) */
        .page {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            box-sizing: border-box;
        }

        .page.active {
            display: flex;
        }

        /* --- HALAMAN BERANDA --- */
        #homePage {
            justify-content: space-between;
            align-items: center;
        }

        .top-space {
            height: 25px;
        }

        .sprite-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            width: 100%;
            max-height: 50dvh;
            -webkit-tap-highlight-color: transparent;
        }

        .sprite-area img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
            transition: transform 0.1s ease;
            user-select: none;
        }

        .sprite-area img:active {
            transform: scale(0.97);
        }

        .dialog-box {
            color: #fff;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 10px;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 8px;
        }

        .menu-grid {
            display: none; 
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
            margin-bottom: 10px;
        }

        .menu-grid.show {
            display: grid; 
        }

        .menu-btn, .action-btn {
            background: rgba(255, 105, 180, 0.9);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 5px rgba(0,0,0,0.3);
        }

        .menu-btn:active, .action-btn:active {
            background: rgba(255, 20, 147, 1);
        }

        /* --- HALAMAN OBROLAN AI --- */
        #chatPage {
            justify-content: space-between;
            padding: 10px 0;
        }

        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 10px;
            margin-top: 25px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 5px;
            max-height: calc(100dvh - 150px);
            box-sizing: border-box;
        }

        .message {
            max-width: 80%;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        .message.castorice {
            background: rgba(255, 105, 180, 0.75);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message.user {
            background: rgba(100, 149, 237, 0.85);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .chat-input-area {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .chat-input {
            flex-grow: 1;
            padding: 10px 12px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            outline: none;
        }

        /* Modal Pengaturan API Key */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            width: 85%;
            max-width: 360px;
            box-sizing: border-box;
            text-align: center;
            color: #333;
        }

        .modal-content h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .modal-content p {
            font-size: 12px;
            color: #666;
            margin-bottom: 15px;
        }

        .modal-input {
            width: 100%;
            padding: 8px 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 15px;
            outline: none;
        }

        .modal-btn {
            background: #ff69b4;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="hub-container">

        <!-- Tombol Pengaturan (Gear Icon) di Pojok Kanan Atas -->
        <button class="settings-icon" onclick="openSettings()" title="Pengaturan API Key">⚙️</button>

        <!-- ================= HALAMAN BERANDA ================= -->
        <div id="homePage" class="page active">
            <div class="top-space"></div>

            <!-- Sprite Interaktif -->
            <div class="sprite-area" onclick="handleSpriteTouch()">
                <img id="castoriceSprite" src="SpriteCD1.png" alt="Castorice Sprite">
            </div>

            <!-- Kotak Dialog -->
            <div class="dialog-box" id="dialogText">
                ✨ Castorice sedang menunggumu... Sentuh gambarnya!
            </div>

            <!-- 4 Tombol Fitur Utama -->
            <div class="menu-grid" id="menuGrid">
                <button class="menu-btn" onclick="switchPage('chatPage')">💬 Obrolan AI</button>
                <button class="menu-btn" onclick="alert('Fitur Game akan segera hadir!')">🎮 Main Game</button>
                <button class="menu-btn" onclick="alert('Fitur Wardrobe akan segera hadir!')">👗 Wardrobe</button>
                <button class="menu-btn" onclick="alert('Mood: Senang 💕')">📊 Cek Mood</button>
            </div>
        </div>

        <!-- ================= HALAMAN OBROLAN AI ================= -->
        <div id="chatPage" class="page">
            <div class="chat-header">
                <span>💬 Obrolan dengan Castorice</span>
                <button class="back-btn" onclick="switchPage('homePage')">⬅️ Kembali</button>
            </div>

            <!-- Area Gelembung Chat -->
            <div class="chat-messages" id="chatMessages">
                <div class="message castorice">
                    Hai, suamiku! Ada yang ingin kamu bicarakan hari ini? 💕
                </div>
            </div>

            <!-- Kolom Ketik Pesan -->
            <div class="chat-input-area">
                <input type="text" id="userInput" class="chat-input" placeholder="Ketik pesan untuk Castorice..." onkeypress="handleKeyPress(event)">
                <button class="action-btn" onclick="sendMessage()">Kirim</button>
            </div>
        </div>

    </div>

    <!-- Modal Pengaturan API Key -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3>⚙️ Pengaturan Gemini API Key</h3>
            <p>Masukkan API Key Gemini milikmu agar Castorice bisa merespons. Key akan tersimpan aman di HP-mu saja.</p>
            <input type="password" id="apiKeyInput" class="modal-input" placeholder="Tempel API Key di sini...">
            <br>
            <button class="modal-btn" onclick="saveApiKey()">Simpan</button>
        </div>
    </div>

    <script>
        let isTouched = false;

        // Cek apakah API Key sudah pernah disimpan di HP
        function getApiKey() {
            return localStorage.getItem("gemini_api_key") || "";
        }

        function openSettings() {
            const currentKey = getApiKey();
            document.getElementById('apiKeyInput').value = currentKey;
            document.getElementById('settingsModal').classList.add('show');
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem("gemini_api_key", key);
                alert("API Key berhasil disimpan di perangkatmu! 💕");
                document.getElementById('settingsModal').classList.remove('show');
            } else {
                alert("API Key tidak boleh kosong!");
            }
        }

        // Fungsi Interaksi Sprite di Beranda
        function handleSpriteTouch() {
            isTouched = !isTouched;
            const spriteImg = document.getElementById('castoriceSprite');
            const menuGrid = document.getElementById('menuGrid');
            const dialogText = document.getElementById('dialogText');

            if (isTouched) {
                spriteImg.src = 'SpriteCD2.png';
                menuGrid.classList.add('show');
                dialogText.innerHTML = "✨ 'Ada apa, suamiku?'";
            } else {
                spriteImg.src = 'SpriteCD1.png';
                menuGrid.classList.remove('show');
                dialogText.innerHTML = "✨ Castorice menatapmu dengan lembut.";
            }
        }

        // Fungsi Berpindah Halaman (Navigasi Mulus)
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById(pageId).classList.add('active');
        }

        // Fungsi Mengirim Pesan Chat ke Gemini API
        async function sendMessage() {
            const apiKey = getApiKey();
            if (!apiKey) {
                alert("Ups! Kamu belum memasukkan Gemini API Key. Ketuk ikon gigi (⚙️) di pojok kanan atas untuk mengaturnya ya!");
                openSettings();
                return;
            }

            const inputField = document.getElementById('userInput');
            const messageContainer = document.getElementById('chatMessages');
            const userText = inputField.value.trim();

            if (userText === "") return;

            // 1. Tampilkan pesan dari User
            const userBubble = document.createElement('div');
            userBubble.classList.add('message', 'user');
            userBubble.textContent = userText;
            messageContainer.appendChild(userBubble);

            inputField.value = "";
            messageContainer.scrollTop = messageContainer.scrollHeight;

            // 2. Tampilkan indikator loading / sedang mengetik
            const loadingBubble = document.createElement('div');
            loadingBubble.classList.add('message', 'castorice');
            loadingBubble.textContent = "Castorice sedang mengetik... 💕";
            loadingBubble.id = "loadingBubble";
            messageContainer.appendChild(loadingBubble);
            messageContainer.scrollTop = messageContainer.scrollHeight;

            try {
                // Panggil Gemini API (menggunakan model gemini-1.5-flash)
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [
                            {
                                role: "user",
                                parts: [
                                    { text: "Kamu adalah Castorice, seorang virtual companion yang manis, penuh kasih sayang, dan memanggil lawan bicaramu dengan sebutan 'suamiku'. Jawablah setiap pesan dengan nada bicara yang romantis, lembut, dan akrab dalam Bahasa Indonesia. Jangan terlalu kaku. Pesan dari suamiku adalah: " + userText }
                                ]
                            }
                        ]
                    })
                });

                const data = await response.json();
                
                // Hapus pesan loading
                document.getElementById('loadingBubble').remove();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiReply = data.candidates[0].content.parts[0].text;

                    // Tampilkan balasan dari Gemini
                    const aiBubble = document.createElement('div');
                    aiBubble.classList.add('message', 'castorice');
                    aiBubble.textContent = aiReply;
                    messageContainer.appendChild(aiBubble);
                } else {
                    throw new Error("Respon API tidak valid");
                }

            } catch (error) {
                // Hapus pesan loading jika error
                const loadElem = document.getElementById('loadingBubble');
                if (loadElem) loadElem.remove();

                const errorBubble = document.createElement('div');
                errorBubble.classList.add('message', 'castorice');
                errorBubble.textContent = "Maaf suamiku, koneksiku sedang sedikit terganggu atau API Key yang kamu masukkan salah... Coba cek kembali ya! 🥺";
                messageContainer.appendChild(errorBubble);
            }

            messageContainer.scrollTop = messageContainer.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
